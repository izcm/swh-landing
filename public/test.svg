
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 180">

  <defs>
    <!-- White reveals, black hides -->
    <radialGradient
      id="light"
      gradientUnits="userSpaceOnUse"
      cx="100"
      cy="80"
      r="55"
    >
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="black" />
    </radialGradient>

    <!-- The mask uses the gradient -->
    <mask
      id="cornerMask"
      maskUnits="userSpaceOnUse"
      x="50" y="50"
      width="100" height="100"
      mask-type="luminance"
    >
      <rect
        x="35" y="10"
        width="130" height="160"
        fill="url(#light)"
      />
    </mask>
  </defs>

  <!-- Cube faces -->
  <path d="M40 50 L100 20 L160 50 L100 80 Z"
        fill="#3781ca" fill-opacity="0.15" />

  <path d="M40 50 L100 80 L100 155 L40 125 Z"
        fill="#3781ca" fill-opacity="0.1" />

  <path d="M100 80 L160 50 L160 125 L100 155 Z"
        fill="#3781ca" fill-opacity="0.07" />

  <!-- Normal cube edges -->
  <path
    d="M40 50 L100 20 L160 50 L160 125
       L100 155 L40 125 Z
       M40 50 L100 80 L160 50
       M100 80 V155"
    fill="none"
    stroke="#5184ba"
    stroke-width="1"
  />

  <!-- Same edges again, but bright and masked -->
  <path
    d="M40 50 L100 20 L160 50 L160 125
       L100 155 L40 125 Z
       M40 50 L100 80 L160 50
       M100 80 V155"
    fill="none"
    stroke="hotpink"
    stroke-width="3"
    mask="url(#cornerMask)"
  />
</svg>
